<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>부동산 종합 탐색기 | 사업규모 및 교육환경 분석</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #21262d; --border: #30363d;
      --accent: #58a6ff; --green: #3fb950; --warn: #f78166; --yellow: #e3b341;
      --text: #e6edf3; --muted: #7d8590;
      --highlight: #ff7c00;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* ══════════════════════════════════════
       ★ 비밀번호 / 만료 게이트 오버레이
    ══════════════════════════════════════ */
    #authGate {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 99999; flex-direction: column; gap: 0;
    }
    #authGate.hidden { display: none; }

    .gate-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 28px 28px;
      width: min(360px, 92vw);
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.7);
    }
    .gate-logo { font-size: 32px; margin-bottom: 8px; }
    .gate-title { font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
    .gate-sub   { font-size: 12px; color: var(--muted); margin-bottom: 24px; }

    .gate-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 16px;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 2px;
    }
    .gate-input:focus { outline: none; border-color: var(--accent); }

    .gate-btn {
      width: 100%;
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }
    .gate-btn:active { opacity: .8; }

    .gate-error {
      font-size: 12px;
      color: var(--warn);
      margin-top: 10px;
      min-height: 18px;
    }
    .gate-expire {
      font-size: 11px;
      color: var(--muted);
      margin-top: 14px;
    }
    .gate-expire span { color: var(--yellow); font-weight: 600; }

    .gate-expired .gate-logo  { filter: grayscale(1); }
    .gate-expired .gate-title { color: var(--warn); }

    /* ══════════════════════════════════════
       ★ 헤더 (모바일 축소)
    ══════════════════════════════════════ */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .logo { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; flex: 1; }
    .logo span { color: var(--muted); font-weight: 300; font-size: 11px; }

    /* ══════════════════════════════════════
       ★ 레이아웃: 모바일 세로 스택
    ══════════════════════════════════════ */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .main { flex-direction: row; }
      .sidebar { width: 320px; height: 100%; }
      #map { flex: 1; }
    }

    .sidebar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      max-height: 55dvh;
      overflow-y: auto;
    }
    @media (min-width: 768px) {
      .sidebar {
        border-bottom: none;
        border-right: 1px solid var(--border);
        max-height: none;
        overflow-y: hidden;
      }
    }

    #map {
      flex: 1;
      background: #1a1a2e;
      min-height: 220px;
    }

    /* ══════════════════════════════════════
       ★ 사이드바 내부
    ══════════════════════════════════════ */
    .section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .section h3 { font-size: 10px; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; margin-bottom: 8px; }

    .addr-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px 11px;
      font-size: 16px;
      font-family: 'Noto Sans KR', sans-serif;
      margin-bottom: 8px;
    }
    .addr-input:focus { outline: none; border-color: var(--accent); }

    .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; justify-content: space-between; }
    .row label { font-size: 12px; color: var(--text); white-space: nowrap; }
    .row select {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 7px 8px;
      font-size: 14px;
    }

    .apt-toggle {
      background: rgba(63, 185, 80, 0.1);
      border: 1px solid rgba(63, 185, 80, 0.3);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .apt-toggle input { cursor: pointer; }
    .apt-toggle span { font-size: 12px; color: var(--green); font-weight: 500; }

    .search-btn {
      width: 100%;
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .search-btn:active { opacity: .85; }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .toggle-row:last-child { margin-bottom: 0; }
    .toggle-row label { font-size: 12px; }
    .toggle { position: relative; width: 36px; height: 18px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--border); border-radius: 20px; cursor: pointer; transition: .2s; }
    .slider:before { content: ''; position: absolute; width: 12px; height: 12px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(18px); }

    .results { flex: 1; overflow-y: auto; padding: 12px 14px; }
    .results h3 { font-size: 10px; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; margin-bottom: 10px; }

    #targetParcelInfo { display: none; background: rgba(88, 166, 255, 0.08); border: 1px solid rgba(88, 166, 255, 0.4); border-radius: 7px; padding: 12px; margin-bottom: 12px; font-size: 12px; line-height: 1.6; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .info-row.total { border-top: 1px dashed var(--border); padding-top: 6px; margin-top: 6px; font-weight: 700; color: var(--yellow); }

    .parcel-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 11px 12px; margin-bottom: 8px; cursor: pointer; transition: all .2s; position: relative; }
    .parcel-card:active { transform: translateY(-1px); }
    .parcel-card.selected { border-color: var(--highlight) !important; box-shadow: 0 0 0 2px rgba(255,124,0,0.35) !important; }

    .parcel-card.school { border-left: 3px solid #b854e6; }
    .parcel-card.school .sname { color: #e7c2ff; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .tag.school { background: #351e45; color: #d49aff; display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 600; margin-bottom: 5px; }
    .parcel-badge { font-size: 10px; color: #b854e6; background: rgba(184,84,230,0.15); border: 1px solid rgba(184,84,230,0.3); padding: 2px 7px; border-radius: 10px; font-weight: 600; margin-left: 6px; }
    .parcel-card .pname { font-size: 12px; color: var(--text); margin-bottom: 4px; }
    .parcel-card .meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; align-items: flex-end; }
    .dist-badge { background: var(--surface); border: 1px solid var(--border); padding: 3px 6px; border-radius: 4px; font-weight: 600; color: var(--accent); }

    .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 0; line-height: 2; }
    .empty .icon { font-size: 28px; margin-bottom: 8px; }

    .status-bar { padding: 6px 14px; background: var(--surface2); border-top: 1px solid var(--border); font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }

    .loading { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 9999; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
    .loading.on { display: flex; }
    .spin { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { font-size: 13px; color: var(--text); font-weight: 500; }

    .map-label { background: rgba(22, 27, 34, 0.9); border: 1.5px solid; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.6); pointer-events: none; transform: translateY(-50%); }
    .map-label.school { border-color: #b854e6; color: #e7c2ff; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── 일조 시뮬레이션 패널 ── */
    .shadow-section { display:none; padding:12px 14px; border-bottom:1px solid var(--border); background: rgba(255,200,50,0.03); flex-shrink:0; }
    .shadow-section.active { display:block; }
    .shadow-section h3 { font-size:10px; color:var(--muted); letter-spacing:.6px; text-transform:uppercase; margin-bottom:10px; }
    .time-slider-wrap { margin-bottom:8px; }
    .time-slider-top  { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
    .time-label { font-size:11px; color:var(--muted); }
    .time-val   { font-size:15px; font-weight:700; color:var(--yellow); font-family:'JetBrains Mono',monospace; }
    #shadowSlider { width:100%; accent-color:var(--yellow); cursor:pointer; }
    .shadow-btns { display:flex; gap:6px; margin-bottom:10px; }
    .shadow-btn  { flex:1; padding:10px 0; border:none; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; touch-action: manipulation; }
    .shadow-btn.play  { background:var(--yellow); color:#0d1117; }
    .shadow-btn.reset { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
    .sun-info-bar { font-size:11px; color:var(--muted); text-align:center; padding:5px 0; background:var(--surface2); border-radius:5px; margin-bottom:8px; font-family:'JetBrains Mono',monospace; }
    .coverage-box { font-size:12px; padding:8px 10px; border-radius:6px; line-height:1.6; }
    .coverage-box.has-shadow  { background:rgba(255,150,0,.08); border:1px solid rgba(255,150,0,.3); }
    .coverage-box.no-shadow   { background:rgba(63,185,80,.08);  border:1px solid rgba(63,185,80,.3); }
    .coverage-box.no-parcel   { background:var(--surface2); border:1px solid var(--border); }
    .height-legend { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    .height-legend span { font-size:10px; display:flex; align-items:center; gap:3px; }
    .hl-dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
    .bld-info-popup { position:absolute; z-index:9000; background:var(--surface); border:1px solid rgba(255,200,50,.5); border-radius:8px; padding:10px 12px; font-size:12px; min-width:180px; box-shadow:0 8px 24px rgba(0,0,0,.8); pointer-events:none; line-height:1.7; }

    #map img { filter: grayscale(1) brightness(0.92) contrast(1.05); }

    .apt-section-header { font-size: 10px; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; margin: 14px 0 10px; display: flex; align-items: center; gap: 6px; }
    .apt-section-header::before { content: ''; flex: 0 0 3px; height: 12px; background: #ffd700; border-radius: 2px; }

    .apt-complex-card { background: rgba(255, 215, 0, 0.04); border: 1px solid rgba(255, 215, 0, 0.25); border-left: 3px solid #ffd700; border-radius: 7px; padding: 11px 12px; margin-bottom: 8px; }
    .apt-complex-card .acname { font-size: 13px; font-weight: 700; color: #ffd700; margin-bottom: 4px; }
    .apt-dist-badge { display: inline-block; font-size: 10px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); padding: 1px 6px; border-radius: 4px; margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }

    .apt-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .apt-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 6px 8px; }
    .apt-stat .sk { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
    .apt-stat .sv { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.2; }
    .apt-stat .sv.gold { color: #ffd700; }
    .apt-stat .sv.blue { color: var(--accent); }
    .apt-stat .sv.green { color: var(--green); }
    .apt-source-badge { font-size: 9px; color: var(--accent); background: rgba(88,166,255,0.12); border: 1px solid rgba(88,166,255,0.25); padding: 1px 4px; border-radius: 3px; margin-left: 4px; vertical-align: middle; font-family: 'JetBrains Mono', monospace; }
    .apt-loading-badge { font-size: 10px; color: var(--muted); font-style: italic; }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════
     ★ 비밀번호 / 만료 게이트
══════════════════════════════════════ -->
<div id="authGate">
  <div class="gate-card" id="gateCard">
    <div class="gate-logo">🏢</div>
    <div class="gate-title">부동산 종합 탐색기</div>
    <div class="gate-sub">사업규모 및 교육환경 분석</div>

    <input
      class="gate-input"
      type="password"
      id="pwInput"
      placeholder="비밀번호 입력"
      autocomplete="current-password"
      onkeydown="if(event.key==='Enter') checkAuth()"
    />
    <button class="gate-btn" onclick="checkAuth()">🔓 입장</button>
    <div class="gate-error" id="gateError"></div>
    <div class="gate-expire">만료일 <span>2026년 6월 30일</span></div>
  </div>
</div>

<!-- ══════════════════════════════════════
     ★ 앱 본체 (인증 후 표시)
══════════════════════════════════════ -->
<header>
  <div class="logo">🏢 부동산 탐색기 <span>| 사업규모 & 교육환경</span></div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="section">
      <h3>📍 주소 검색 및 분석</h3>
      <input class="addr-input" id="addrInput" placeholder="예: 송파구 가락동 910" onkeydown="if(event.key==='Enter') doSearch()" />

      <div class="row">
        <label>학교 검색 반경</label>
        <select id="radiusSel">
          <option value="200">200m</option>
          <option value="300">300m</option>
          <option value="500" selected>500m</option>
          <option value="1000">1km</option>
        </select>
      </div>

      <label class="apt-toggle">
        <input type="checkbox" id="searchApt" checked />
        <span>🏢 학교 클릭 시 → 반경 300m 대형단지 조회</span>
      </label>

      <button class="search-btn" onclick="doSearch()">🔍 부지 분석 및 주변 검색</button>
      <button class="search-btn" id="shadowModeBtn" onclick="activateShadowMode()"
        style="display:none; margin-top:6px; background:rgba(227,179,65,0.15); color:var(--yellow); border:1px solid rgba(227,179,65,0.4);">
        🌞 일조 시뮬레이션 시작 (동지 기준)
      </button>
    </div>

    <div class="section">
      <h3>🗺 지도 레이어</h3>
      <div class="toggle-row">
        <label>지적편집도</label>
        <label class="toggle"><input type="checkbox" onchange="toggleCadastral(this)" checked /><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <label>스카이뷰</label>
        <label class="toggle"><input type="checkbox" onchange="toggleSkyview(this)" /><span class="slider"></span></label>
      </div>
      <div class="toggle-row" style="margin-top:8px; padding-top:8px; border-top:1px solid var(--border);">
        <label style="font-size:11px;">🏫 절대보호구역 <span style="color:#ff3b30;font-size:10px;">■</span> 50m</label>
        <label class="toggle"><input type="checkbox" id="toggleEduZone" onchange="toggleEduZoneDisplay(this)" checked /><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <label style="font-size:11px;">🏫 상대보호구역 <span style="color:#ff9500;font-size:10px;">■</span> 200m</label>
        <label class="toggle"><input type="checkbox" id="toggleEduZone2" onchange="toggleEduZoneDisplay(this)" checked /><span class="slider"></span></label>
      </div>
    </div>

    <!-- ★ 일조 시뮬레이션 패널 -->
    <div class="shadow-section" id="shadowSection">
      <h3>🌞 일조 시뮬레이션 (15분 단위)</h3>
      <div class="height-legend">
        <span><div class="hl-dot" style="background:#88ccff"></div>~15m</span>
        <span><div class="hl-dot" style="background:#ffcc00"></div>~30m</span>
        <span><div class="hl-dot" style="background:#ff9900"></div>~60m</span>
        <span><div class="hl-dot" style="background:#ff4444"></div>60m+</span>
      </div>
      <div class="row" style="margin-bottom:8px;">
        <label style="font-size:12px;">📅 날짜</label>
        <!-- 모바일 부하를 줄이기 위해 동지(12월 21일)로 고정 -->
        <input type="text" id="shadowDate" style="flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:6px 8px; font-size:14px; text-align:center;" value="12월 21일 (동지) 고정" readonly />
        <input type="hidden" id="shadowDateHidden" value="2025-12-21" />
      </div>
      <div class="time-slider-wrap">
        <div class="time-slider-top">
          <span class="time-label">⏰ 시간</span>
          <span class="time-val" id="shadowTimeLabel">12:00</span>
        </div>
        <!-- step=0.25 로 15분 단위 계산 수행 -->
        <input type="range" id="shadowSlider" min="8" max="17" step="0.25" value="12" oninput="onShadowSlider(this)" />
        <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:2px;">
          <span>08:00</span><span>12:00</span><span>17:00</span>
        </div>
      </div>
      <div class="shadow-btns">
        <button class="shadow-btn play" id="shadowPlayBtn" onclick="toggleShadowAnim()">▶ 재생</button>
        <button class="shadow-btn reset" onclick="exitShadowMode()">✕ 종료</button>
      </div>
      <div class="sun-info-bar" id="sunInfoBar">태양 위치 계산 대기 중...</div>
      <div id="shadowCoverageBox"></div>
    </div>

    <div class="results" id="resultList">
      <div id="targetParcelInfo"></div>
      <h3>📋 주변 학교 검색 결과</h3>
      <div id="schoolListWrapper">
        <div class="empty"><div class="icon">🗂</div>주소를 검색하세요</div>
      </div>
      <div id="aptListSection" style="display:none;">
        <div class="apt-section-header">🏢 학교 200m 이내 단지 건축물대장</div>
        <div id="aptCardList"></div>
      </div>
    </div>
    <div class="status-bar" id="statusBar">대기 중...</div>
  </div>
  <div id="map"></div>
</div>

<div class="loading" id="loading">
  <div class="spin"></div>
  <p id="loadingMsg">처리 중...</p>
